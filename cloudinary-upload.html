<!DOCTYPE html>
<html>
<head>
  <title>Memory Book - Cloudinary Upload</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #1a1a1a; color: #fff; }
    h1 { color: #B8860B; }
    .status { margin: 5px 0; padding: 8px; border-radius: 4px; font-size: 14px; }
    .pending { background: #333; }
    .uploading { background: #4a3000; color: #B8860B; }
    .done { background: #1a4a1a; color: #4CAF50; }
    .error { background: #4a1a1a; color: #f44336; }
    #log { max-height: 500px; overflow-y: auto; background: #111; padding: 10px; border-radius: 8px; margin-top: 20px; }
    button { background: #B8860B; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #DAA520; }
    button:disabled { background: #555; cursor: not-allowed; }
    .progress { font-size: 24px; color: #B8860B; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>Memory Book - Upload to Cloudinary</h1>
  <p>Select ALL files from: <code>memory-book/public/assets/</code></p>
  <input type="file" id="fileInput" multiple webkitdirectory directory />
  <br>
  <button id="uploadBtn" onclick="startUpload()" disabled>Upload All Files</button>
  <div class="progress" id="progress"></div>
  <div id="log"></div>

  <script>
    const CLOUD_NAME = 'gdbmrkzo';
    const UPLOAD_PRESET = 'memory-book';
    let files = [];

    document.getElementById('fileInput').addEventListener('change', (e) => {
      files = Array.from(e.target.files).filter(f => 
        f.type.startsWith('image/') || f.type.startsWith('video/')
      );
      document.getElementById('uploadBtn').disabled = files.length === 0;
      document.getElementById('progress').textContent = `Found ${files.length} media files`;
    });

    async function startUpload() {
      document.getElementById('uploadBtn').disabled = true;
      const log = document.getElementById('log');
      const results = [];
      let done = 0;

      for (const file of files) {
        const relativePath = file.webkitRelativePath || file.name;
        const resourceType = file.type.startsWith('video/') ? 'video' : 'image';
        
        // Build the Cloudinary folder path
        let folder = 'memory-book';
        const pathParts = relativePath.split('/');
        if (pathParts.length > 1) {
          folder = pathParts.slice(1, -1).join('/'); // remove first dir (public) and filename
        }

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);
        formData.append('folder', folder);
        formData.append('resource_type', resourceType);

        const div = document.createElement('div');
        div.className = 'status uploading';
        div.textContent = `Uploading: ${file.name}...`;
        log.appendChild(div);

        try {
          const response = await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`,
            { method: 'POST', body: formData }
          );
          const data = await response.json();
          
          if (data.secure_url) {
            done++;
            div.className = 'status done';
            div.textContent = `✓ ${file.name} → ${data.secure_url}`;
            results.push({ name: file.name, url: data.secure_url, path: relativePath });
          } else {
            div.className = 'status error';
            div.textContent = `✗ ${file.name} → ${data.error?.message || 'Unknown error'}`;
          }
        } catch (err) {
          div.className = 'status error';
          div.textContent = `✗ ${file.name} → ${err.message}`;
        }

        document.getElementById('progress').textContent = `${done}/${files.length} uploaded`;
      }

      // Output JSON mapping
      const jsonDiv = document.createElement('div');
      jsonDiv.style.cssText = 'background:#222;padding:15px;border-radius:8px;margin-top:15px;white-space:pre-wrap;font-size:12px;max-height:300px;overflow:auto;';
      jsonDiv.textContent = JSON.stringify(results, null, 2);
      log.appendChild(jsonDiv);

      document.getElementById('progress').textContent = `Done! ${done}/${files.length} files uploaded`;
      document.getElementById('uploadBtn').disabled = false;
    }
  </script>
</body>
</html>
